name: Windows kurulum dosyası

# "v0.7.0" gibi bir etiket gönderilince Windows'ta Setup.exe ve zip üretilir,
# GitHub'da o sürümün "Release" sayfasına yüklenir.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Paketle (Setup.exe + zip)
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sürüm sayfasına yükle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          NOTES=$(cat release-notes.md 2>/dev/null || echo "Radyo $VERSION")
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Radyo $VERSION" --notes "$NOTES" --latest
          gh release upload "$TAG" dist/Radyo-Kurulum.exe "dist/Radyo-$VERSION-win.zip" --clobber
