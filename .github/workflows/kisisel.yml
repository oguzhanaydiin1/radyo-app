name: Kişisel site (oguzhanaydin.com.tr)

# kisisel/ klasörü değişince ya da elle başlatılınca siteyi Cloudflare'e yükler.
on:
  push:
    branches: [main]
    paths: ['kisisel/**', '.github/workflows/kisisel.yml']
  workflow_dispatch:

concurrency: kisisel-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kisisel
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Siteyi yükle
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4.151.1 deploy 2>&1 | tee deploy.log; then
            grep -v '^\s*$' deploy.log | tail -25 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=wrangler::$line"; done
            exit 1
          fi
      - name: Çalışıyor mu?
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null https://oguzhanaydin.com.tr/; then echo "oguzhanaydin.com.tr yayında"; exit 0; fi
            sleep 10
          done
          echo "::warning title=alan adı::oguzhanaydin.com.tr henüz yanıt vermiyor (birkaç dakika içinde etkinleşir)."
