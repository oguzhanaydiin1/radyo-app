name: Android test APK

# Windows arayüzünü (renderer/) Android köprüsüyle Capacitor uygulamasına sarar, hata ayıklama
# imzalı bir APK derler ve "android-test" sürüm sayfasına koyar. Elle başlatılır.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web dosyalarını hazırla (Windows arayüzü + Android köprüsü)
        working-directory: .
        run: node mobile/scripts/build-www.js

      - name: Android projesini oluştur
        id: ver
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # Simgeler
          cp -r res/. android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          # Sürüm bilgisi
          V=$(node -p "require('../package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V-test\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          # Arka planda çalarken ekranın kapanmasına izin ver, ağ izni zaten var.
          grep -n "versionName\|versionCode" android/app/build.gradle

      - name: APK derle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../OA-Radyo-test.apk
          ls -la ../OA-Radyo-test.apk

      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: OA Radyo Android (test)
          prerelease: true
          body: |
            Sürüm: ${{ steps.ver.outputs.v }}
            build: ${{ github.run_number }}

            OA Radyo'nun Android test sürümü. Telefonda bu sayfayı açıp OA-Radyo-test.apk dosyasını indir ve kur.
            Kurulum sırasında Android "bilinmeyen kaynaklardan yükleme" izni isteyebilir.
          files: mobile/OA-Radyo-test.apk
          fail_on_unmatched_files: true
