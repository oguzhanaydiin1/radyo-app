name: Android

# Windows arayüzünü (renderer/) Android köprüsü ve yerel eklentiyle (mobile/native) Capacitor
# uygulamasına çevirir. Elle başlatılır:
#   test  → hata ayıklama APK'sı, "android-test" sürüm sayfası
#   yayin → Google Play için imzalı AAB + APK, "android-latest" sürüm sayfası
#           (ANDROID_RELEASE_* gizli değerleri gerekir)
on:
  workflow_dispatch:
    inputs:
      kanal:
        description: 'test: deneme APK’sı · yayin: Google Play için imzalı AAB + APK'
        type: choice
        options: [test, yayin]
        default: test

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      OA_CHANNEL: ${{ inputs.kanal == 'yayin' && 'release' || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web dosyalarını hazırla (Windows arayüzü + Android köprüsü)
        working-directory: .
        run: node mobile/scripts/build-www.js

      - name: Android projesini oluştur ve yamala
        id: ver
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          cp -r res/. android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          V=$(node -p "require('../package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if [ "$OA_CHANNEL" = release ]; then export OA_RELEASE=1; fi
          node scripts/patch-android.js "$V" "${{ github.run_number }}"
          grep -n "targetSdkVersion\|compileSdkVersion" android/variables.gradle

      - name: Sabit test imzası (varsa)
        if: env.OA_CHANNEL == 'test'
        env:
          KS: ${{ secrets.ANDROID_TEST_KEYSTORE }}
        run: |
          # Her test derlemesi aynı anahtarla imzalansın; yoksa yeni APK eskisinin üzerine kurulamaz.
          if [ -n "$KS" ]; then
            mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "Sabit test anahtarı kullanılıyor."
          else
            echo "::warning title=imza::ANDROID_TEST_KEYSTORE gizli değeri yok; APK rastgele bir anahtarla imzalandı, telefondaki eski sürümün üzerine kurulamaz."
          fi

      - name: Test APK'sını derle
        if: env.OA_CHANNEL == 'test'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../OA-Radyo-test.apk
          ls -la ../OA-Radyo-test.apk

      - name: Yayın sürümünü derle (imzalı AAB + APK)
        if: env.OA_CHANNEL == 'release'
        working-directory: mobile/android
        env:
          KS: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          OA_KS_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          OA_KS_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          OA_KS_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$OA_KS_PASSWORD" ] || [ -z "$OA_KS_ALIAS" ] || [ -z "$OA_KS_KEY_PASSWORD" ]; then
            echo "::error title=imza::Yayın için ANDROID_RELEASE_KEYSTORE, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS ve ANDROID_RELEASE_KEY_PASSWORD gizli değerleri gerekli."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/oa-release.keystore"
          export OA_KS_FILE="$RUNNER_TEMP/oa-release.keystore"
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon -q
          V="${{ steps.ver.outputs.v }}"
          cp app/build/outputs/bundle/release/app-release.aab "../OA-Radyo-$V.aab"
          cp app/build/outputs/apk/release/app-release.apk "../OA-Radyo-$V.apk"
          cp app/build/outputs/apk/release/app-release.apk "../OA-Radyo-Android.apk"
          rm -f "$RUNNER_TEMP/oa-release.keystore"
          ls -la ../OA-Radyo-*.aab ../OA-Radyo-*.apk

      - name: Test sürüm sayfasına koy
        if: env.OA_CHANNEL == 'test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: OA Radyo Android (test)
          prerelease: true
          make_latest: false
          body: |
            Sürüm: ${{ steps.ver.outputs.v }}
            build: ${{ github.run_number }}

            OA Radyo'nun Android test sürümü. Telefonda bu sayfayı açıp OA-Radyo-test.apk dosyasını indir ve kur.
            Kurulum sırasında Android "bilinmeyen kaynaklardan yükleme" izni isteyebilir.
          files: mobile/OA-Radyo-test.apk
          fail_on_unmatched_files: true

      - name: Yayın sayfasına koy
        if: env.OA_CHANNEL == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: OA Radyo Android ${{ steps.ver.outputs.v }}
          prerelease: false
          make_latest: false
          body: |
            Sürüm: ${{ steps.ver.outputs.v }}
            build: ${{ github.run_number }}

            Google Play'e yüklenecek dosya: OA-Radyo-${{ steps.ver.outputs.v }}.aab
            Doğrudan kurulum için: OA-Radyo-${{ steps.ver.outputs.v }}.apk
          files: |
            mobile/OA-Radyo-${{ steps.ver.outputs.v }}.aab
            mobile/OA-Radyo-${{ steps.ver.outputs.v }}.apk
          fail_on_unmatched_files: true

      # Sabit adlı APK'yı son (Windows ile aynı numaralı) sürüme de koy: sitedeki ve OA Labs Center'daki
      # "Android için indir" releases/latest/download/OA-Radyo-Android.apk adresinden her zaman en yenisini alır.
      - name: Son sürüme Android APK'sını ekle
        if: env.OA_CHANNEL == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: mobile/OA-Radyo-Android.apk
          fail_on_unmatched_files: true
