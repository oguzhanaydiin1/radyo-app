# Geçici: önerilen podcast'lerin Apple kimliklerini çözer. İş bitince silinir.
name: Teşhis (podcast)
on:
  workflow_dispatch:
jobs:
  coz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Önerilenleri çöz
        run: |
          node - <<'JS'
          const list = require('./stations/podcastler.json');
          const fold = (s) => s.toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          (async () => {
            for (const [lang, country] of [['tr', 'TR'], ['en', 'US']]) {
              for (const e of list[lang]) {
                const u = `https://itunes.apple.com/search?media=podcast&entity=podcast&country=${country}&limit=5&term=${encodeURIComponent(e.term)}`;
                let j = null;
                for (let a = 0; a < 3 && !j; a++) {
                  const r = await fetch(u);
                  if (r.ok) j = await r.json(); else { console.log('# bekle', r.status); await sleep(8000); }
                }
                const want = fold(e.term);
                const res = (j && j.results) || [];
                const hit = res.find((x) => fold(x.collectionName).includes(want) || want.includes(fold(x.collectionName)));
                console.log('RES ' + JSON.stringify({ lang, term: e.term, id: hit ? hit.collectionId : null, name: hit ? hit.collectionName : null, author: hit ? hit.artistName : null, feed: hit ? hit.feedUrl : null, cands: res.map((x) => x.collectionName).slice(0, 3) }));
                await sleep(3500);
              }
            }
            const r = await fetch('https://itunes.apple.com/lookup?entity=podcast&id=1200361736,1001990447');
            console.log('LOOKUP', r.status, (await r.text()).slice(0, 300).replace(/\s+/g, ' '));
          })();
          JS
