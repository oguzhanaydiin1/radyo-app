name: Sunucu (api.oalabs.dev)

# server/ klasörü değişince ya da elle başlatılınca sunucuyu Cloudflare'e yükler.
# Gerekli GitHub "secret"ları (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, OA_ADMIN_KEY, OA_PEPPER
#   RESEND_API_KEY (isteğe bağlı; e-posta listesinin onay e-postaları için)
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/api.yml']
  workflow_dispatch:

concurrency: api-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_SET: ${{ secrets.OA_ADMIN_KEY != '' }}
      PEPPER_SET: ${{ secrets.OA_PEPPER != '' }}
      RESEND_SET: ${{ secrets.RESEND_API_KEY != '' }}
    steps:
      - name: "Var mı: CLOUDFLARE_API_TOKEN"
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: "true"
        working-directory: .
      - name: "Var mı: CLOUDFLARE_ACCOUNT_ID"
        if: env.CLOUDFLARE_ACCOUNT_ID != ''
        run: "true"
        working-directory: .
      - name: "Var mı: OA_ADMIN_KEY"
        if: env.ADMIN_SET == 'true'
        run: "true"
        working-directory: .
      - name: "Var mı: OA_PEPPER"
        if: env.PEPPER_SET == 'true'
        run: "true"
        working-directory: .
      - name: "Var mı: RESEND_API_KEY"
        if: env.RESEND_SET == 'true'
        run: "true"
        working-directory: .
      - name: Cloudflare bilgileri girilmiş mi?
        id: check
        env:
          HAS_ADMIN: ${{ secrets.OA_ADMIN_KEY != '' }}
          HAS_PEPPER: ${{ secrets.OA_PEPPER != '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo var || echo YOK)"
          echo "CLOUDFLARE_ACCOUNT_ID: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo var || echo YOK)"
          echo "OA_ADMIN_KEY: $([ "$HAS_ADMIN" = true ] && echo var || echo YOK)"
          echo "OA_PEPPER: $([ "$HAS_PEPPER" = true ] && echo var || echo YOK)"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secret'ları henüz eklenmemiş; yükleme atlandı."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.check.outputs.skip != '1'

      - name: Veritabanını bul ya da oluştur
        if: steps.check.outputs.skip != '1'
        run: |
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==='oa-stats');process.stdout.write(d?d.uuid:'')})")
          if [ -z "$ID" ]; then
            npx wrangler d1 create oa-stats
            ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);process.stdout.write(l.find(x=>x.name==='oa-stats').uuid)})")
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          npx wrangler d1 execute oa-stats --remote --file schema.sql

      - name: Sunucuyu yükle
        if: steps.check.outputs.skip != '1'
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            # Hata satırlarını GitHub notu olarak göster (anahtar içermez).
            grep -v '^\s*$' deploy.log | tail -25 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=wrangler::$line"; done
            exit 1
          fi

      - name: Gizli değerleri ayarla
        if: steps.check.outputs.skip != '1'
        env:
          OA_ADMIN_KEY: ${{ secrets.OA_ADMIN_KEY }}
          OA_PEPPER: ${{ secrets.OA_PEPPER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '%s' "$OA_ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
          printf '%s' "$OA_PEPPER" | npx wrangler secret put PEPPER
          # E-posta gönderimi (isteğe bağlı): GitHub'a RESEND_API_KEY eklenince etkinleşir.
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi

      - name: Resend anahtarı çalışıyor mu?
        if: steps.check.outputs.skip != '1' && env.RESEND_SET == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          K=$(printf '%s' "$RESEND_API_KEY" | tr -d '[:space:]')
          echo "::notice title=resend::Anahtar uzunluğu ${#K}, başı ${K:0:3}"
          CODE=$(curl -s -o r.json -w '%{http_code}' https://api.resend.com/domains -H "Authorization: Bearer $K")
          MSG=$(node -e "try{const j=require('./r.json');console.log(j.message||(j.data||[]).map(d=>d.name+'='+d.status).join(', '))}catch{console.log('')}")
          echo "::notice title=resend::HTTP $CODE — $MSG"
          rm -f r.json
        working-directory: .
      - name: Çalışıyor mu?
        if: steps.check.outputs.skip != '1'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://api.oalabs.dev/v1/health; then exit 0; fi
            sleep 10
          done
          echo "api.oalabs.dev henüz yanıt vermiyor (alan adı birkaç dakika içinde etkinleşir)."
