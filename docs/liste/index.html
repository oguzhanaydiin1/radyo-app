<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-posta listesi — OA Labs</title>
  <meta name="description" content="OA Labs e-posta listesi: yeni uygulamalar ve önemli güncellemeler.">
  <meta name="theme-color" content="#0D0F16">
  <link rel="canonical" href="https://oalabs.dev/liste/">
  <link rel="icon" href="../radyo/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css">
  <style>
    .state-box { margin: 72px 0 40px; max-width: 40em; }
    .state-box h1 { margin: 0 0 14px; font: 800 clamp(38px, 6vw, 56px)/1.05 var(--display); letter-spacing: -0.02em; }
    .state-box p { margin: 0; color: var(--text-2); font-size: 19px; }
    .state-box .btn { margin-top: 28px; }
    main section { padding-top: 0; }
  </style>
</head>
<body>
  <header class="site-head">
    <nav class="wrap nav" aria-label="Site">
      <a class="logo" href="/"><span class="oa-mark" aria-hidden="true">OA</span>OA Labs</a>
    </nav>
  </header>
  <main class="wrap">
    <div class="state-box" id="durum">
      <h1>E-posta listesi</h1>
      <p>Yeni uygulamalar ve önemli güncellemeler için ayda en fazla birkaç e-posta. Reklam yok, istediğin zaman ayrılabilirsin.</p>
    </div>
    <section aria-label="Listeye katıl" id="form-alani">
      <div class="join">
        <div class="join-text">
          <h2 class="h2">Listeye katıl</h2>
          <p>Adresini yaz, gelen onay bağlantısına tıkla. Hepsi bu.</p>
        </div>
        <form class="join-form" data-join="liste" novalidate>
          <div class="join-row">
            <label class="sr-only" for="join-email-liste">E-posta adresin</label>
            <input id="join-email-liste" name="email" type="email" autocomplete="email" inputmode="email" placeholder="ornek@eposta.com" required>
            <button class="btn primary" type="submit">Listeye katıl</button>
          </div>
          <div class="hp" aria-hidden="true"><label>Web sitesi <input name="website" tabindex="-1" autocomplete="off"></label></div>
          <label class="join-consent"><input type="checkbox" name="consent" required><span>OA Labs uygulamalarıyla ilgili duyuruları e-postayla almayı kabul ediyorum. İstediğim zaman tek tıkla ayrılabilirim. <a href="/gizlilik/#liste">Gizlilik politikası</a></span></label>
          <p class="join-msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-foot">
    <div class="wrap foot">
      <div><div class="foot-brand">OA Labs</div><div>© 2026 · Oğuzhan Aydın</div></div>
      <div class="foot-links"><a href="mailto:destek@oalabs.dev">destek@oalabs.dev</a><a class="quiet" href="/gizlilik/#liste">Gizlilik politikası</a></div>
    </div>
  </footer>
  <script src="../abone.js" defer></script>
  <script>
    (function () {
      var S = {
        onaylandi: ['Listeye katıldın, teşekkürler!', 'Artık yeni uygulamalardan ve önemli güncellemelerden ilk sen haberdar olacaksın. Her e-postanın altında ayrılma bağlantısı var.', true],
        ayrildi: ['Listeden ayrıldın', 'E-posta adresin listemizden tamamen silindi. Fikrini değiştirirsen aşağıdan yeniden katılabilirsin.', false],
        gecersiz: ['Bu bağlantı geçersiz', 'Bağlantının süresi dolmuş ya da daha önce kullanılmış olabilir. Aşağıdan adresini yeniden yazabilirsin.', false],
      };
      var d = new URLSearchParams(location.search).get('durum');
      if (!S[d]) return;
      var box = document.getElementById('durum');
      box.innerHTML = '';
      var h = document.createElement('h1'); h.textContent = S[d][0];
      var p = document.createElement('p'); p.textContent = S[d][1];
      box.append(h, p);
      if (S[d][2]) {
        var a = document.createElement('a'); a.className = 'btn primary'; a.href = '/'; a.textContent = 'OA Labs ana sayfası';
        box.append(a);
        document.getElementById('form-alani').hidden = true;
      }
    })();
  </script>
</body>
</html>
